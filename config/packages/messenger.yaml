framework:
    messenger:
        failure_transport: failed

        transports:
            # Redis transport for asynchronous message processing
            # Configure MESSENGER_TRANSPORT_DSN=redis://127.0.0.1:6379/messages in your .env file
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route NotifyStudentsMessage to Redis transport for async processing
            App\Message\NotifyStudentsMessage: async
            
            # Route ImportStudentsMessage to Redis transport for async processing
            App\Message\ImportStudentsMessage: async
